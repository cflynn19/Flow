name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The API tests run against a real PostgreSQL: the engine leans on jsonb,
    # `distinct on` and filtered aggregates, so a mock would not prove much.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flow_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flow_dev
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flow_test
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres flow_test

      - run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed demo data
        run: npm run db:seed

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
